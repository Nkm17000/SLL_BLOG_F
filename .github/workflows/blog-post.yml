name: Smart Learning Lab - Static UX Blog Publisher

on:
  # Test automatically whenever the workflow/project is pushed to main.
  push:
    branches:
      - main

  # Manual run from Actions tab.
  workflow_dispatch:
    inputs:
      topic_index:
        description: "Optional static blog index. Leave blank for automatic rotation."
        required: false
        type: string

  # 10 runs per day in India Standard Time.
  schedule:
    - cron: "30 6,8,10,12,14,16,18,20,22,0 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: smart-learning-lab-static-ux-blog
  cancel-in-progress: false

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      FACEBOOK_GRAPH_API_VERSION: "v23.0"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Validate Facebook secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FACEBOOK_PAGE_ID" || { echo "ERROR: Missing FACEBOOK_PAGE_ID repository secret"; exit 1; }
          test -n "$FACEBOOK_PAGE_TOKEN" || { echo "ERROR: Missing FACEBOOK_PAGE_TOKEN repository secret"; exit 1; }
          echo "Facebook secrets are configured."

      - name: Validate Python project
        run: python -m compileall -q app

      - name: Validate static blog data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/static_blogs.json")
          if not path.exists():
              raise SystemExit("ERROR: data/static_blogs.json not found")

          data = json.loads(path.read_text(encoding="utf-8"))
          blogs = data.get("blogs", [])
          if not blogs:
              raise SystemExit("ERROR: No blogs found in data/static_blogs.json")

          print(f"Static blogs available: {len(blogs)}")
          print("Static blog validation successful.")
          PY

      - name: Show UX assets
        run: |
          test -d assets/ux_designs
          find assets/ux_designs -maxdepth 2 -type f | sort | head -100

      - name: Generate and publish
        env:
          TOPIC_INDEX: ${{ github.event.inputs.topic_index || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$TOPIC_INDEX" ]; then
            python -m app.run_agent --topic-index "$TOPIC_INDEX"
          else
            python -m app.run_agent
          fi

      - name: Show generated output
        if: always()
        run: |
          echo "Generated output:"
          find output -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort || true

      - name: Upload generated output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-learning-lab-blog-${{ github.run_number }}
          path: output/**
          if-no-files-found: warn
          retention-days: 1

      - name: Commit rotation state and metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/blog_history.json output/*.json

          if git diff --cached --quiet; then
            echo "No state or metadata changes to commit."
            exit 0
          fi

          git commit -m "Generate static UX technical blog [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Smart Learning Lab - 20 Agent Publisher

on:
  # Run automatically when project code/content is pushed.
  # Ignore the rotation-history file so the workflow does not trigger itself
  # when it commits the updated history after a successful run.
  push:
    branches:
      - '**'
    paths-ignore:
      - 'data/blog_history.json'
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent (auto follows Asia/Kolkata schedule)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - student
          - tech_facts
          - ai
          - ai_tools
          - coding
          - debugging
          - howto
          - concepts
          - cloud
          - database
          - app_development
          - cybersecurity
          - experiments
          - projects
          - productivity
          - career
          - news
          - infographic
          - repurposing
          - technical_blog
      dry_run:
        description: "Generate without publishing"
        required: false
        default: false
        type: boolean
  schedule:
    # 04:00 through 23:00 IST, every hour. IST = UTC+05:30.
    # Corresponding UTC hours: 22,23,0..17 at minute 30.
    - cron: "30 22,23,0-17 * * *"

permissions:
  contents: write

concurrency:
  group: smart-learning-lab-20-agents
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FACEBOOK_GRAPH_API_VERSION: v23.0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate project
        run: |
          python -m compileall -q app
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          agents=json.loads((root/'data/agent_schedule.json').read_text(encoding='utf-8'))
          assert agents['posts_per_day'] == 20
          assert len(agents['schedule']) == 20
          banks=sorted((root/'data/agents').glob('*_topics.json'))
          assert len(banks) == 20, f'Expected 20 agent banks, found {len(banks)}'
          for p in banks:
              d=json.loads(p.read_text(encoding='utf-8'))
              assert d['count'] == 2000, (p,d['count'])
              assert len(d['blogs']) == 2000, p
              assert all(len(b['points']) == 5 for b in d['blogs']), p
          print('Validated 20 agents, 20 x 2,000 topics = 40,000 topic records, 5 points each')
          PY

      - name: Generate and publish
        env:
          AGENT_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.agent || 'auto' }}
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            python -u -m app.run_agent --agent "$AGENT_INPUT" --dry-run
          else
            python -u -m app.run_agent --agent "$AGENT_INPUT"
          fi

      - name: Commit history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog_history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update 20-agent rotation history [skip ci]"
          git push

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-learning-lab-20-agents-${{ github.run_number }}
          path: |
            output/latest_summary.json
            output/*.png
            data/blog_history.json
          if-no-files-found: warn

name: Smart Learning Lab - Technical Blog Publisher

on:
  # Publish the next pending blog whenever code/content is pushed to main.
  # The bot's own history/output commit is excluded below so it cannot trigger itself again.
  push:
    branches:
      - main
    paths-ignore:
      - "data/blog_history.json"
      - "output/**"
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Optional topic ID. Leave blank for the next pending topic."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: smart-learning-lab-technical-blog
  cancel-in-progress: false

jobs:
  publish-blog:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      FACEBOOK_GRAPH_API_VERSION: "v23.0"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GROQ_API_KEY" || { echo "ERROR: Missing GROQ_API_KEY repository secret"; exit 1; }
          test -n "$FACEBOOK_PAGE_ID" || { echo "ERROR: Missing FACEBOOK_PAGE_ID repository secret"; exit 1; }
          test -n "$FACEBOOK_PAGE_TOKEN" || { echo "ERROR: Missing FACEBOOK_PAGE_TOKEN repository secret"; exit 1; }

      - name: Validate Python project
        run: python -m compileall -q app

      - name: Generate and publish next blog
        env:
          TOPIC_ID: ${{ github.event.inputs.topic_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$TOPIC_ID" ]; then
            python -m app.run_agent --topic "$TOPIC_ID"
          else
            python -m app.run_agent
          fi

      - name: Commit history and generated blog JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/blog_history.json output/*.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Publish technical blog and update history [skip ci]"
          git push origin HEAD:main

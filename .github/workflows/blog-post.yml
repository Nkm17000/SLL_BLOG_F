name: Smart Learning Lab - Dynamic Technical Blog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate one blog without publishing to Facebook"
        required: false
        default: "false"
        type: boolean
  push:
    branches:
      - "**"
  schedule:
    # Six runs every day at 00:00, 04:00, 08:00, 12:00, 16:00 and 20:00 UTC.
    # This is 05:30, 09:30, 13:30, 17:30, 21:30 and 01:30 IST respectively.
    - cron: "0 0,4,8,12,16,20 * * *"

permissions:
  contents: write

concurrency:
  group: smart-learning-lab-blog-publisher
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FACEBOOK_GRAPH_API_VERSION: v23.0

jobs:
  publish:
    name: Generate 1 blog image and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium for HTML rendering
        run: python -m playwright install --with-deps chromium

      - name: Validate JSON and project
        run: |
          python -m compileall -q app
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/blogs.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          blogs=data.get('blogs', [])
          assert len(blogs) == 2000, f'Expected 2000 blog topics, found {len(blogs)}'
          for b in blogs:
              assert len(b.get('points', [])) == 5, f"{b.get('id')} must have exactly 5 points"
          print(f'Validated {len(blogs)} blog topics')
          PY

      - name: Generate and publish exactly one blog
        env:
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            python -u -m app.run_agent --dry-run
          else
            python -u -m app.run_agent
          fi

      - name: Commit rotation and history
        if: success()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git add data/blog_history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "chore: update blog rotation history [skip ci]"
          git rebase "origin/$BRANCH" || {
            echo "History changed upstream; aborting rebase and retrying with fresh state."
            git rebase --abort || true
            git reset --hard "origin/$BRANCH"
            exit 1
          }
          git push origin "HEAD:$BRANCH"

      - name: Print workflow trigger
        if: always()
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run: ${{ github.run_number }}"

      - name: Upload generated image and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-learning-lab-blog-${{ github.run_number }}
          path: |
            output/latest_summary.json
            output/*.png
            data/blog_history.json
          if-no-files-found: warn

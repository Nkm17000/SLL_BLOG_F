name: Smart Learning Lab - Technical Blog Publisher

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      topic_index:
        description: "Optional static blog index. Leave blank for automatic rotation."
        required: false
        type: string

  # 10 runs/day in Asia/Kolkata.
  schedule:
    - cron: "30 6,8,10,12,14,16,18,20,22,0 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: smart-learning-lab-blog-publisher
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FACEBOOK_GRAPH_API_VERSION: "v23.0"

jobs:
  publish-blog:
    name: Generate + Publish Technical Blog
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

    steps:
      - name: 01 - START - Print runner diagnostics
        run: |
          set -euxo pipefail
          echo "============================================================"
          echo "SMART LEARNING LAB WORKFLOW STARTED"
          echo "Run number : $GITHUB_RUN_NUMBER"
          echo "Run ID     : $GITHUB_RUN_ID"
          echo "Event      : $GITHUB_EVENT_NAME"
          echo "Ref        : $GITHUB_REF"
          echo "SHA        : $GITHUB_SHA"
          echo "UTC        : $(date -u)"
          echo "IST        : $(TZ=Asia/Kolkata date)"
          echo "Runner     : $RUNNER_NAME"
          echo "OS         : $RUNNER_OS"
          echo "============================================================"

      - name: 02 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 03 - Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 04 - Install dependencies WITH LOGGING
        run: |
          set -euxo pipefail
          mkdir -p output/logs output/diagnostics
          exec > >(tee -a output/logs/04_install.log) 2>&1
          echo "Installing dependencies..."
          python --version
          python -m pip --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip list
          echo "DEPENDENCY INSTALL SUCCESS"

      - name: 05 - Validate secrets WITH LOGGING
        run: |
          set -euxo pipefail
          mkdir -p output/logs output/diagnostics
          exec > >(tee -a output/logs/05_secrets.log) 2>&1
          echo "Checking required Facebook secrets..."
          if [ -z "${FACEBOOK_PAGE_ID:-}" ]; then
            echo "ERROR: FACEBOOK_PAGE_ID is EMPTY or NOT CONFIGURED"
            exit 1
          fi
          if [ -z "${FACEBOOK_PAGE_TOKEN:-}" ]; then
            echo "ERROR: FACEBOOK_PAGE_TOKEN is EMPTY or NOT CONFIGURED"
            exit 1
          fi
          echo "FACEBOOK_PAGE_ID: configured"
          echo "FACEBOOK_PAGE_TOKEN: configured (value hidden)"
          echo "GRAPH API: $FACEBOOK_GRAPH_API_VERSION"
          echo "SECRET VALIDATION SUCCESS"

      - name: 06 - Validate project WITH LOGGING
        run: |
          set -euxo pipefail
          exec > >(tee -a output/logs/06_project_validation.log) 2>&1
          echo "Checking project files..."
          test -f data/static_blogs.json
          test -f data/blog_history.json
          test -f app/run_agent.py
          test -f app/image_generator.py
          test -f app/facebook_service.py
          test -d assets/source/smart_learning_lab_section_assets
          python -m compileall -q app
          echo "PROJECT VALIDATION SUCCESS"

      - name: 07 - Run smoke tests WITH LOGGING
        run: |
          set -euxo pipefail
          exec > >(tee -a output/logs/07_tests.log) 2>&1
          echo "Running full smoke test suite..."
          python -m unittest discover -s tests -v
          echo "SMOKE TESTS SUCCESS"

      - name: 08 - Validate static blogs WITH LOGGING
        run: |
          set -euxo pipefail
          exec > >(tee -a output/logs/08_static_json.log) 2>&1
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/static_blogs.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          blogs = data.get("blogs", [])
          print(f"Static blog count: {len(blogs)}")
          if not blogs:
              raise SystemExit("ERROR: No blogs found")
          for i, blog in enumerate(blogs):
              if not blog.get("title"):
                  raise SystemExit(f"ERROR: Blog {i} has no title")
              if len(blog.get("sections", [])) < 8:
                  raise SystemExit(f"ERROR: Blog {i} has fewer than 8 sections")
          print("STATIC JSON VALIDATION SUCCESS")
          PY

      - name: 09 - Show rotation state
        run: |
          set -euxo pipefail
          exec > >(tee -a output/logs/09_rotation.log) 2>&1
          echo "Current rotation state:"
          cat data/blog_history.json

      - name: 10 - Generate + Facebook publish WITH FULL LOGGING
        id: publisher
        continue-on-error: true
        env:
          TOPIC_INDEX: ${{ github.event.inputs.topic_index || '' }}
        run: |
          set -uo pipefail
          mkdir -p output/logs output/diagnostics
          LOG_FILE="output/logs/10_publisher.log"

          # EVERYTHING from the publisher is shown in the GitHub step log
          # AND saved to a file for artifact download.
          exec > >(tee -a "$LOG_FILE") 2>&1

          echo "============================================================"
          echo "PUBLISHER STARTED"
          echo "UTC: $(date -u)"
          echo "IST: $(TZ=Asia/Kolkata date)"
          echo "Run: $GITHUB_RUN_NUMBER"
          echo "Topic override: ${TOPIC_INDEX:-automatic rotation}"
          echo "============================================================"

          set -x

          if [ -n "$TOPIC_INDEX" ]; then
            python -u -m app.run_agent --topic-index "$TOPIC_INDEX"
          else
            python -u -m app.run_agent
          fi

          STATUS=$?
          set +x

          echo "PUBLISHER EXIT CODE: $STATUS"
          echo "$STATUS" > output/diagnostics/publisher_exit_code.txt

          if [ "$STATUS" -ne 0 ]; then
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "PUBLISHER FAILED"
            echo "The exact Python traceback/API error should be above."
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          else
            echo "PUBLISHER SUCCESS"
          fi

          exit "$STATUS"

      - name: 11 - ALWAYS print generated files and logs
        if: always()
        run: |
          set +e
          echo "============================================================"
          echo "POST-RUN DIAGNOSTICS"
          echo "Job status: ${{ job.status }}"
          echo "Publisher outcome: ${{ steps.publisher.outcome }}"
          echo "============================================================"

          mkdir -p output/logs output/diagnostics

          echo "--- OUTPUT FILES ---"
          find output -maxdepth 4 -type f -printf '%p | %s bytes\n' | sort || true

          echo "--- ALL LOG FILES ---"
          for file in output/logs/*.log; do
            [ -f "$file" ] || continue
            echo ""
            echo "================ $file ================"
            cat "$file" || true
          done

          echo "--- ROTATION STATE ---"
          cat data/blog_history.json || true

          echo "--- PYTHON / PIP ---"
          python --version || true
          python -m pip --version || true

      - name: 12 - ALWAYS upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-learning-lab-debug-run-${{ github.run_number }}
          path: |
            output/**
            data/blog_history.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: 13 - Write GitHub Step Summary
        if: always()
        run: |
          {
            echo "# Smart Learning Lab - Run $GITHUB_RUN_NUMBER"
            echo
            echo "- **Job status:** ${{ job.status }}"
            echo "- **Publisher outcome:** ${{ steps.publisher.outcome }}"
            echo "- **Event:** $GITHUB_EVENT_NAME"
            echo "- **Commit:** $GITHUB_SHA"
            echo "- **UTC:** $(date -u)"
            echo "- **IST:** $(TZ=Asia/Kolkata date)"
            echo
            echo "## Generated files"
            find output -maxdepth 4 -type f -printf '%p (%s bytes)\n' 2>/dev/null | sort || true
            echo
            echo "## Debug artifact"
            echo "Download the artifact named: smart-learning-lab-debug-run-$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 14 - Fail workflow if publisher failed
        if: always()
        run: |
          if [ "${{ steps.publisher.outcome }}" != "success" ]; then
            echo "============================================================"
            echo "WORKFLOW FAILED: publisher step did not succeed."
            echo "Open step '10 - Generate + Facebook publish WITH FULL LOGGING'."
            echo "Also download the debug artifact from this run."
            echo "============================================================"
            exit 1
          fi
          echo "Publisher succeeded."

      - name: 15 - Commit rotation state
        if: success()
        run: |
          set -euxo pipefail
          exec > >(tee -a output/logs/15_git_commit.log) 2>&1
          git config user.name "smart-learning-lab-bot"
          git config user.email "smart-learning-lab-bot@users.noreply.github.com"
          git add data/blog_history.json
          if git diff --cached --quiet; then
            echo "No rotation state changes to commit."
            exit 0
          fi
          git commit -m "Update technical blog rotation state [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "GIT PUSH SUCCESS"

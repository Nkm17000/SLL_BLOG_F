name: Smart Learning Lab 247 Technical Blog
on:
  push:
    branches:
      - main
  schedule:
    # Exactly one scheduled run daily at 09:00 Asia/Kolkata (03:30 UTC). Pushes also trigger, but app enforces max one live post per IST day.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate the blog caption and infographic without publishing to Facebook"
        required: true
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: daily-technical-article-facebook
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8
  FACEBOOK_GRAPH_API_VERSION: v23.0
  APP_NAME: Smart Learning Lab 247
jobs:
  daily-blog-image-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      FACEBOOK_PAGE_ID_2: ${{ secrets.FACEBOOK_PAGE_ID_2 }}
      FACEBOOK_PAGE_TOKEN_2: ${{ secrets.FACEBOOK_PAGE_TOKEN_2 }}
      FACEBOOK_PAGE_ID_3: ${{ secrets.FACEBOOK_PAGE_ID_3 }}
      FACEBOOK_PAGE_TOKEN_3: ${{ secrets.FACEBOOK_PAGE_TOKEN_3 }}
      FACEBOOK_PAGE_ID_4: ${{ secrets.FACEBOOK_PAGE_ID_4 }}
      FACEBOOK_PAGE_TOKEN_4: ${{ secrets.FACEBOOK_PAGE_TOKEN_4 }}
      FACEBOOK_PAGE_ID_5: ${{ secrets.FACEBOOK_PAGE_ID_5 }}
      FACEBOOK_PAGE_TOKEN_5: ${{ secrets.FACEBOOK_PAGE_TOKEN_5 }}
      FACEBOOK_PAGE_ID_6: ${{ secrets.FACEBOOK_PAGE_ID_6 }}
      FACEBOOK_PAGE_TOKEN_6: ${{ secrets.FACEBOOK_PAGE_TOKEN_6 }}
      FACEBOOK_PAGE_ID_7: ${{ secrets.FACEBOOK_PAGE_ID_7 }}
      FACEBOOK_PAGE_TOKEN_7: ${{ secrets.FACEBOOK_PAGE_TOKEN_7 }}
      FACEBOOK_PAGE_ID_8: ${{ secrets.FACEBOOK_PAGE_ID_8 }}
      FACEBOOK_PAGE_TOKEN_8: ${{ secrets.FACEBOOK_PAGE_TOKEN_8 }}
      FACEBOOK_PAGE_ID_9: ${{ secrets.FACEBOOK_PAGE_ID_9 }}
      FACEBOOK_PAGE_TOKEN_9: ${{ secrets.FACEBOOK_PAGE_TOKEN_9 }}
      FACEBOOK_PAGE_ID_10: ${{ secrets.FACEBOOK_PAGE_ID_10 }}
      FACEBOOK_PAGE_TOKEN_10: ${{ secrets.FACEBOOK_PAGE_TOKEN_10 }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID_2: ${{ secrets.INSTAGRAM_USER_ID_2 }}
      INSTAGRAM_ACCESS_TOKEN_2: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_2 }}
      INSTAGRAM_USER_ID_3: ${{ secrets.INSTAGRAM_USER_ID_3 }}
      INSTAGRAM_ACCESS_TOKEN_3: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_3 }}
      INSTAGRAM_USER_ID_4: ${{ secrets.INSTAGRAM_USER_ID_4 }}
      INSTAGRAM_ACCESS_TOKEN_4: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_4 }}
      INSTAGRAM_USER_ID_5: ${{ secrets.INSTAGRAM_USER_ID_5 }}
      INSTAGRAM_ACCESS_TOKEN_5: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_5 }}
      INSTAGRAM_USER_ID_6: ${{ secrets.INSTAGRAM_USER_ID_6 }}
      INSTAGRAM_ACCESS_TOKEN_6: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_6 }}
      INSTAGRAM_USER_ID_7: ${{ secrets.INSTAGRAM_USER_ID_7 }}
      INSTAGRAM_ACCESS_TOKEN_7: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_7 }}
      INSTAGRAM_USER_ID_8: ${{ secrets.INSTAGRAM_USER_ID_8 }}
      INSTAGRAM_ACCESS_TOKEN_8: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_8 }}
      INSTAGRAM_USER_ID_9: ${{ secrets.INSTAGRAM_USER_ID_9 }}
      INSTAGRAM_ACCESS_TOKEN_9: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_9 }}
      INSTAGRAM_USER_ID_10: ${{ secrets.INSTAGRAM_USER_ID_10 }}
      INSTAGRAM_ACCESS_TOKEN_10: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_10 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch full article, summarize with Groq, render a unique-color infographic, and publish image plus caption
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m app.run_agent --dry-run
          else
            python -m app.run_agent
          fi
      - name: Commit topic history
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog_history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update daily technical blog history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload generated text and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-technical-article-${{ github.run_number }}
          path: |
            output/latest_post.txt
            output/latest_summary.json
            output/images/latest_blog.jpg
            data/blog_history.json
          if-no-files-found: warn

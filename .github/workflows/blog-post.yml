name: Smart Learning Lab - Technical Blog Publisher

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      topic_index:
        description: "Optional static blog index. Leave blank for automatic rotation."
        required: false
        type: string

  # 10 runs every day at 06:30, 08:30, 10:30, 12:30, 14:30,
  # 16:30, 18:30, 20:30, 22:30 and 00:30 IST.
  schedule:
    - cron: "30 6,8,10,12,14,16,18,20,22,0 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write
  actions: read

concurrency:
  group: smart-learning-lab-blog-publisher
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  FACEBOOK_GRAPH_API_VERSION: "v23.0"

jobs:
  publish-blog:
    name: Generate + Publish Technical Blog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

    steps:
      - name: 01 - Workflow started
        run: |
          echo "============================================================"
          echo "SMART LEARNING LAB - WORKFLOW STARTED"
          echo "Run number: $GITHUB_RUN_NUMBER"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          echo "UTC: $(date -u)"
          echo "IST: $(TZ=Asia/Kolkata date)"
          echo "============================================================"

      - name: 02 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 03 - Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 04 - Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python --version
          pip --version
          pip show Pillow requests python-dotenv || true

      - name: 05 - Validate secrets
        run: |
          set -euo pipefail
          echo "Checking Facebook configuration..."
          if [ -z "${FACEBOOK_PAGE_ID:-}" ]; then
            echo "ERROR: FACEBOOK_PAGE_ID is missing."
            exit 1
          fi
          if [ -z "${FACEBOOK_PAGE_TOKEN:-}" ]; then
            echo "ERROR: FACEBOOK_PAGE_TOKEN is missing."
            exit 1
          fi
          echo "FACEBOOK_PAGE_ID: configured"
          echo "FACEBOOK_PAGE_TOKEN: configured"
          echo "FACEBOOK_GRAPH_API_VERSION: ${FACEBOOK_GRAPH_API_VERSION}"

      - name: 06 - Validate project files
        run: |
          set -euxo pipefail
          test -f data/static_blogs.json
          test -f data/blog_history.json
          test -f app/run_agent.py
          test -f app/image_generator.py
          test -f app/facebook_service.py
          test -d assets/source/smart_learning_lab_section_assets
          python -m compileall -q app
          echo "Project validation passed."

      - name: 07 - Validate static blog JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/static_blogs.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          blogs = data.get("blogs", [])
          print(f"Static blog count: {len(blogs)}")
          assert blogs, "No blogs found"
          for i, blog in enumerate(blogs):
              assert blog.get("title"), f"Blog {i} has no title"
              assert len(blog.get("sections", [])) >= 8, f"Blog {i} needs 8 sections"
          print("Static blog validation PASSED")
          PY

      - name: 08 - Show rotation state
        run: |
          echo "Current blog_history.json:"
          cat data/blog_history.json

      - name: 09 - Generate and publish
        run: |
          set -o pipefail
          echo "Starting Python publisher..."
          python -u -m app.run_agent 2>&1 | tee output/workflow_console.log

      - name: 10 - Show generated output
        if: always()
        run: |
          echo "Output directory:"
          find output -maxdepth 3 -type f -printf '%p (%s bytes)\n' | sort || true
          echo "Latest log tail:"
          latest=$(find output/logs -type f -name '*.log' -print | sort | tail -1 || true)
          if [ -n "$latest" ]; then
            tail -n 200 "$latest"
          fi

      - name: 11 - Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-learning-lab-debug-${{ github.run_number }}
          path: |
            output/**/*.log
            output/*.jpg
            output/*.json
            data/blog_history.json
          if-no-files-found: warn
          retention-days: 7

      - name: 12 - Commit rotation state
        if: success()
        run: |
          set -euo pipefail
          git config user.name "smart-learning-lab-bot"
          git config user.email "smart-learning-lab-bot@users.noreply.github.com"
          git add data/blog_history.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update technical blog rotation state [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Rotation state pushed successfully."

      - name: 13 - Final status
        if: always()
        run: |
          echo "============================================================"
          echo "WORKFLOW FINISHED"
          echo "Job status: ${{ job.status }}"
          echo "Run number: $GITHUB_RUN_NUMBER"
          echo "============================================================"

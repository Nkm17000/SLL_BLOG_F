name: Daily Fresh Technical Topic to Facebook
on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/blog_history.json"
  schedule:
    # 09:00 Asia/Kolkata = 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate the blog caption and infographic without publishing to Facebook"
        required: true
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: daily-technical-article-facebook
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8
  FACEBOOK_GRAPH_API_VERSION: v23.0
  APP_NAME: Smart Learning Lab 247
jobs:
  daily-blog-carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch full article, summarize with Groq, render a unique-color infographic, and publish image plus caption
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m app.run_agent --dry-run
          else
            python -m app.run_agent
          fi
      - name: Commit topic history
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog_history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update daily technical blog history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload generated text and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-technical-article-${{ github.run_number }}
          path: |
            output/latest_post.txt
            output/latest_summary.json
            output/images/latest_blog.jpg
            data/blog_history.json
          if-no-files-found: warn

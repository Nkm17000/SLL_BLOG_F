name: Daily Technical Blog Carousel to Facebook
on:
  push:
    branches:
      - main
  schedule:
    # 09:00 Asia/Kolkata = 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate slides without publishing to Facebook"
        required: true
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: daily-technical-blog-facebook
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8
  FACEBOOK_GRAPH_API_VERSION: v23.0
  APP_NAME: Smart Learning Lab 247
jobs:
  daily-blog-carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Generate and publish daily technical carousel
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m app.run_agent --dry-run
          else
            python -m app.run_agent
          fi
      - name: Commit topic history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog_history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update daily technical blog history [skip ci]"
          git push
      - name: Upload generated slides and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-technical-blog-${{ github.run_number }}
          path: |
            output/carousels/**
            output/latest_summary.json
            data/blog_history.json
          if-no-files-found: warn

name: Smart Learning Lab - Technical Blog Publisher

on:
  # Run automatically whenever workflow code is pushed to main.
  # This is useful for testing the workflow immediately.
  push:
    branches:
      - main

  # Allow manual execution from GitHub Actions.
  workflow_dispatch:

  # 10 executions every day at these IST times.
  schedule:
    - cron: "30 6,8,10,12,14,16,18,20,22,0 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: smart-learning-lab-blog-publisher
  cancel-in-progress: false

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Setup Python
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ---------------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ---------------------------------------------------------
      # 4. Verify static blog data
      # ---------------------------------------------------------
      - name: Verify static blog JSON
        run: |
          test -f data/static_blogs.json
          echo "Static blog JSON found."

          python - <<'PY'
          import json

          path = "data/static_blogs.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          blogs = data.get("blogs", [])

          if not blogs:
              raise SystemExit("ERROR: No blogs found in static_blogs.json")

          print(f"Static blogs available: {len(blogs)}")

          for blog in blogs:
              if not blog.get("title"):
                  raise SystemExit("ERROR: Blog without title found.")

          print("Static blog JSON validation successful.")
          PY

      # ---------------------------------------------------------
      # 5. Verify UX assets
      # ---------------------------------------------------------
      - name: Verify UX designs
        run: |
          echo "Checking UX assets..."

          test -d assets/ux_designs

          for dir in \
            clean_modern_green \
            dark_ai_futuristic \
            warm_friendly_orange \
            nature_fresh_green \
            purple_creative_ai
          do
            if [ ! -d "assets/ux_designs/$dir" ]; then
              echo "ERROR: Missing UX directory: $dir"
              exit 1
            fi

            echo "Found UX: $dir"
          done

          echo "All 5 UX designs are available."

      # ---------------------------------------------------------
      # 6. Generate ONE blog image
      #
      # The Python generator is responsible for:
      #   Blog 1 -> UX 1
      #   Blog 2 -> UX 2
      #   Blog 3 -> UX 3
      #   Blog 4 -> UX 4
      #   Blog 5 -> UX 5
      #   Blog 6 -> UX 1
      #   ...
      #
      # Each scheduled execution therefore produces one image.
      # 10 scheduled executions = 10 images/day.
      # ---------------------------------------------------------
      - name: Generate blog image
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python generate_blog.py

      # ---------------------------------------------------------
      # 7. Show generated files
      # ---------------------------------------------------------
      - name: Show generated output
        run: |
          echo "Generated files:"
          find output -maxdepth 2 -type f -print 2>/dev/null || true

      # ---------------------------------------------------------
      # 8. Commit UX rotation state + generated metadata
      #
      # This is important because blog_history.json stores which
      # UX should be used next.
      # ---------------------------------------------------------
      - name: Commit rotation state
        run: |
          git config user.name "smart-learning-lab-bot"
          git config user.email "smart-learning-lab-bot@users.noreply.github.com"

          git add data/blog_history.json || true

          if git diff --cached --quiet; then
            echo "No rotation-state changes to commit."
          else
            git commit -m "Update blog UX rotation state [skip ci]"
            git push
          fi

      # ---------------------------------------------------------
      # 9. Upload generated image as GitHub artifact
      # ---------------------------------------------------------
      - name: Upload generated image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-blog-${{ github.run_number }}
          path: |
            output/**
          if-no-files-found: warn
          retention-days: 1
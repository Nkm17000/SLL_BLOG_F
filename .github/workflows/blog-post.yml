name: Smart Learning Lab - Static UX Blog Publisher

on:
  workflow_dispatch:
    inputs:
      topic_index:
        description: "Optional static blog index. Leave blank for automatic rotation."
        required: false
        type: string
  # 10 runs per 24 hours, approximately every 2 hours.
  # GitHub cron uses UTC. These correspond roughly to 00:00, 02:00, ... 18:00 IST
  # plus the three UTC evening runs that continue the same 10-run cycle.
  schedule:
    - cron: "30 0,2,4,6,8,10,12 * * *"
    - cron: "30 18,20,22 * * *"

permissions:
  contents: write

concurrency:
  group: smart-learning-lab-static-ux-blog
  cancel-in-progress: false

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      FACEBOOK_GRAPH_API_VERSION: "v23.0"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FACEBOOK_PAGE_ID" || { echo "ERROR: Missing FACEBOOK_PAGE_ID"; exit 1; }
          test -n "$FACEBOOK_PAGE_TOKEN" || { echo "ERROR: Missing FACEBOOK_PAGE_TOKEN"; exit 1; }

      - name: Validate Python project
        run: python -m compileall -q app

      - name: Generate and publish
        env:
          TOPIC_INDEX: ${{ github.event.inputs.topic_index || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$TOPIC_INDEX" ]; then
            python -m app.run_agent --topic-index "$TOPIC_INDEX"
          else
            python -m app.run_agent
          fi

      - name: Commit state and generated JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog_history.json output/*.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Generate static UX technical blog [skip ci]"
          git push origin HEAD:main

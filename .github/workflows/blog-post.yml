name: Smart Learning Lab - Technical Blog Publisher

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Optional topic ID. Leave blank to publish the next pending topic."
        required: false
        type: string
  schedule:
    # 20:30 IST = 15:00 UTC
    - cron: "0 15 * * *"

permissions:
  contents: write

concurrency:
  group: smart-learning-lab-technical-blog
  cancel-in-progress: false

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      FACEBOOK_GRAPH_API_VERSION: "v23.0"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Validate secrets
        run: |
          test -n "$GROQ_API_KEY" || { echo "Missing GROQ_API_KEY"; exit 1; }
          test -n "$FACEBOOK_PAGE_ID" || { echo "Missing FACEBOOK_PAGE_ID"; exit 1; }
          test -n "$FACEBOOK_PAGE_TOKEN" || { echo "Missing FACEBOOK_PAGE_TOKEN"; exit 1; }

      - name: Validate project
        run: python -m compileall -q app

      - name: Generate and publish blog
        env:
          TOPIC_ID: ${{ inputs.topic_id }}
        run: |
          if [ -n "$TOPIC_ID" ]; then
            python -m app.run_agent --topic "$TOPIC_ID"
          else
            python -m app.run_agent
          fi

      - name: Commit history and generated blog JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog_history.json output/*.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Publish technical blog and update history"
            git push origin HEAD:main
          fi
